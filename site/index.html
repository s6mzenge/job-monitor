<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Monitor — Daily Brief</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    details[open] summary ~ * { animation: slideDown 0.2s ease-out; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .score-dot { width: 7px; height: 7px; border-radius: 50%; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">Job Monitor</h1>
        <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">Daily Brief — Automated Intelligence</p>
      </div>
      <button onclick="toggleDark()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors" title="Toggle dark mode">
        <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-6 space-y-6" id="main">
    <div id="loading" class="text-center py-16 text-slate-400 dark:text-slate-500">
      <svg class="w-8 h-8 mx-auto mb-3 animate-spin text-slate-300 dark:text-slate-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
      Loading reports…
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 mt-auto">
    <div class="max-w-3xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-slate-500 dark:text-slate-400">
      <p>&copy; 2026 Moritz Engel</p>
      <p>Evaluated by Gemini · Updated three times daily</p>
    </div>
  </footer>

  <script>
    const DATA_BASE = './data';
    const MAX_DAYS_SHOWN = 14;

    // ── Dark mode ──
    function toggleDark() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('dark', document.documentElement.classList.contains('dark'));
    }
    if (localStorage.getItem('dark') === 'true' || (!localStorage.getItem('dark') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    // ── Helpers ──
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function formatDate(str) {
      const [y, m, d] = str.split('-');
      const date = new Date(+y, +m - 1, +d);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(+y, +m - 1, +d);
      const diff = Math.round((today - target) / 86400000);
      let relative = '';
      if (diff === 0) relative = 'Today';
      else if (diff === 1) relative = 'Yesterday';
      else if (diff < 7) relative = `${diff} days ago`;
      const full = date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return relative ? `${relative} — ${full}` : full;
    }

    function scoreDots(n, colorClass) {
      const val = parseInt(n) || 0;
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<div class="score-dot ${i <= val ? colorClass : 'bg-slate-200 dark:bg-slate-600'}"></div>`;
      }
      return html;
    }

    function metaValue(val) {
      return val && val.toLowerCase() !== 'not specified';
    }

    // ── Build a single job card ──
    function jobCard(job, idx) {
      const level = (job.match || 'low').toLowerCase();
      const isHigh = level === 'high';
      const isMedium = level === 'medium';
      const isLow = level === 'low' || level === 'none';

      let borderColor, bgColor, badgeBg, badgeText, dotColor;
      if (isHigh) {
        borderColor = 'border-green-200 dark:border-green-800';
        bgColor = 'bg-green-50/60 dark:bg-green-900/20';
        badgeBg = 'bg-green-100 dark:bg-green-900/50';
        badgeText = 'text-green-700 dark:text-green-400';
        dotColor = 'bg-green-500';
      } else if (isMedium) {
        borderColor = 'border-amber-200 dark:border-amber-800';
        bgColor = 'bg-amber-50/60 dark:bg-amber-900/20';
        badgeBg = 'bg-amber-100 dark:bg-amber-900/50';
        badgeText = 'text-amber-700 dark:text-amber-400';
        dotColor = 'bg-amber-500';
      } else {
        borderColor = 'border-slate-200 dark:border-slate-700';
        bgColor = 'bg-white dark:bg-slate-800';
        badgeBg = 'bg-slate-100 dark:bg-slate-700';
        badgeText = 'text-slate-500 dark:text-slate-400';
        dotColor = 'bg-slate-400';
      }

      const meta = [];
      if (job.organisation) meta.push(`<span class="text-slate-600 dark:text-slate-300">${esc(job.organisation)}</span>`);
      if (metaValue(job.location)) meta.push(`<span>${esc(job.location)}</span>`);
      if (metaValue(job.type)) meta.push(`<span>${esc(job.type)}</span>`);
      if (metaValue(job.deadline)) meta.push(`<span>Due ${esc(job.deadline)}</span>`);
      if (metaValue(job.salary)) meta.push(`<span>${esc(job.salary)}</span>`);

      let scores = '';
      if (job.field_score || job.skills_score || job.seniority_score) {
        scores = `<div class="flex items-center gap-3 mt-2 text-xs text-slate-500 dark:text-slate-400">`;
        if (job.field_score) scores += `<div class="flex items-center gap-1.5"><span>Field</span><div class="flex gap-0.5">${scoreDots(job.field_score, dotColor)}</div></div>`;
        if (job.skills_score) scores += `<div class="flex items-center gap-1.5"><span>Skills</span><div class="flex gap-0.5">${scoreDots(job.skills_score, dotColor)}</div></div>`;
        if (job.seniority_score) scores += `<div class="flex items-center gap-1.5"><span>Seniority</span><div class="flex gap-0.5">${scoreDots(job.seniority_score, dotColor)}</div></div>`;
        scores += `</div>`;
      }

      return `
        <div class="fade-in rounded-lg border ${borderColor} ${bgColor} p-4" style="animation-delay:${Math.min(idx, 12) * 40}ms">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <h3 class="font-semibold text-slate-800 dark:text-slate-100 leading-snug">
                ${job.url ? `<a href="${esc(job.url)}" target="_blank" rel="noopener" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">${esc(job.title)}<svg class="w-3 h-3 inline ml-1 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>` : esc(job.title)}
              </h3>
              ${meta.length ? `<div class="flex flex-wrap gap-x-2 gap-y-0.5 mt-1.5 text-xs text-slate-500 dark:text-slate-400">${meta.join('<span class="text-slate-300 dark:text-slate-600">·</span>')}</div>` : ''}
              ${scores}
              ${job.reason ? `<p class="mt-2 text-sm text-slate-500 dark:text-slate-400 leading-relaxed">${esc(job.reason)}</p>` : ''}
            </div>
            <span class="shrink-0 text-xs font-medium px-2 py-1 rounded-md ${badgeBg} ${badgeText}">${level}</span>
          </div>
        </div>`;
    }

    // ── Build a day section ──
    function daySection(dateStr, data, isFirst) {
      const jobs = data.jobs || [];
      if (jobs.length === 0) return '';

      const high = jobs.filter(j => j.match === 'high');
      const medium = jobs.filter(j => j.match === 'medium');
      const low = jobs.filter(j => j.match !== 'high' && j.match !== 'medium');
      const recommended = [...high, ...medium];

      const totalBadge = `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">${jobs.length} job${jobs.length === 1 ? '' : 's'}</span>`;
      const highBadge = high.length ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-400">${high.length} high</span>` : '';
      const medBadge = medium.length ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400">${medium.length} medium</span>` : '';

      let html = `
        <section class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <h2 class="font-semibold text-slate-800 dark:text-slate-100">${formatDate(dateStr)}</h2>
              <div class="flex items-center gap-1.5">${totalBadge}${highBadge}${medBadge}</div>
            </div>
          </div>`;

      // Recommended
      if (recommended.length > 0) {
        html += `
          <div class="px-5 py-4">
            <div class="flex items-center gap-2 mb-3">
              <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"/></svg>
              <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Recommended for You</h3>
            </div>
            <div class="space-y-3">
              ${recommended.map((j, i) => jobCard(j, i)).join('')}
            </div>
          </div>`;
      }

      // Low matches — collapsible
      if (low.length > 0) {
        const bordTop = recommended.length > 0 ? 'border-t border-slate-100 dark:border-slate-700' : '';
        html += `
          <div class="${bordTop}">
            <button onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.chev').classList.toggle('rotate-90')"
              class="w-full text-left px-5 py-3 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors cursor-pointer">
              <span class="text-sm text-slate-500 dark:text-slate-400">${low.length} other listing${low.length === 1 ? '' : 's'} (not matched)</span>
              <svg class="chev w-4 h-4 text-slate-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 18l6-6-6-6"/></svg>
            </button>
            <div class="hidden px-5 pb-4 space-y-3">
              ${low.map((j, i) => jobCard(j, i)).join('')}
            </div>
          </div>`;
      }

      html += `</section>`;
      return html;
    }

    // ── Init ──
    async function init() {
      const main = document.getElementById('main');
      const loading = document.getElementById('loading');
      try {
        const resp = await fetch(`${DATA_BASE}/dates.json?t=${Date.now()}`);
        if (!resp.ok) throw new Error();
        const dates = (await resp.json()).sort().reverse();
        if (dates.length === 0) throw new Error();

        // Load up to MAX_DAYS_SHOWN days
        const toLoad = dates.slice(0, MAX_DAYS_SHOWN);
        const results = await Promise.all(toLoad.map(async d => {
          try {
            const r = await fetch(`${DATA_BASE}/${d}.json?t=${Date.now()}`);
            if (!r.ok) return null;
            return { date: d, data: await r.json() };
          } catch { return null; }
        }));

        loading.remove();

        // Summary bar
        const allJobs = results.filter(Boolean).flatMap(r => r.data.jobs || []);
        const totalHigh = allJobs.filter(j => j.match === 'high').length;
        const totalMedium = allJobs.filter(j => j.match === 'medium').length;
        const totalAll = allJobs.length;

        if (totalAll > 0) {
          main.insertAdjacentHTML('afterbegin', `
            <div class="grid grid-cols-3 gap-3">
              <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-4 text-center shadow-sm">
                <div class="text-2xl font-bold text-slate-800 dark:text-slate-100">${totalAll}</div>
                <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">New Jobs</div>
              </div>
              <div class="bg-white dark:bg-slate-800 rounded-xl border border-green-200 dark:border-green-800 p-4 text-center shadow-sm">
                <div class="text-2xl font-bold text-green-600 dark:text-green-400">${totalHigh}</div>
                <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">High Match</div>
              </div>
              <div class="bg-white dark:bg-slate-800 rounded-xl border border-amber-200 dark:border-amber-800 p-4 text-center shadow-sm">
                <div class="text-2xl font-bold text-amber-600 dark:text-amber-400">${totalMedium}</div>
                <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Medium Match</div>
              </div>
            </div>
          `);
        }

        // Day sections
        let hasContent = false;
        for (const result of results) {
          if (!result || (result.data.jobs || []).length === 0) continue;
          hasContent = true;
          main.insertAdjacentHTML('beforeend', daySection(result.date, result.data, !hasContent));
        }

        if (!hasContent) {
          main.insertAdjacentHTML('beforeend', `
            <div class="text-center py-16 text-slate-400 dark:text-slate-500">
              <svg class="w-12 h-12 mx-auto mb-3 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <p class="font-medium">No new jobs found recently</p>
              <p class="text-sm mt-1">Check back after the next monitor run.</p>
            </div>
          `);
        }

      } catch (e) {
        loading.innerHTML = `
          <svg class="w-12 h-12 mx-auto mb-3 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <p class="font-medium text-slate-500 dark:text-slate-400">No reports available yet</p>
          <p class="text-sm mt-1">The monitor will generate data on its next run.</p>
        `;
      }
    }

    init();
  </script>
</body>
</html>
