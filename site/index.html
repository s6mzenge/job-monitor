<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C4A52" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./favicon.svg">
<title>Job Monitor — Daily Dispatch</title>
<script>
/* set theme before paint to avoid a flash */
(function(){try{var s=JSON.parse(localStorage.getItem('jm_settings')||'null');
var dark=s&&typeof s.dark==='boolean'?s.dark:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=dark?'dark':'light';}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — "Daily Dispatch"
   Petrol chrome · cool newsprint · single ochre signal.
   Newsreader (editorial serif) / Inter (UI) / IBM Plex Mono (data).
   ============================================================ */
:root{
  --paper:#E8EAE5; --card:#FBFCFA; --line:#D6D9D1; --line-soft:#E4E7E0;
  --ink:#14181C; --ink-soft:#4C545A; --mute:#8A918C;
  --petrol:#0C4A52; --petrol-ink:#072F35; --link:#0E6B78;
  --match:#1C7A4D; --match-bg:#E4F0E8;
  --watch:#9A5B00; --watch-bg:#F4ECDD;
  --urgent:#AE382C; --urgent-bg:#F4E3E0;
  --gold:#B8842B;
  --shadow:0 1px 2px rgba(20,24,28,.05), 0 8px 24px -16px rgba(20,24,28,.28);
}
html[data-theme="dark"]{
  --paper:#0D1316; --card:#161D21; --line:#28312F; --line-soft:#202927;
  --ink:#E8EBE6; --ink-soft:#A7AFAB; --mute:#727A76;
  --petrol:#0C4A52; --petrol-ink:#0A3940; --link:#3FB4C0;
  --match:#46C088; --match-bg:#11271E;
  --watch:#D79A3A; --watch-bg:#2A2114;
  --urgent:#E0796C; --urgent-bg:#2A1715;
  --gold:#D6A552;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
body{margin:0;background:#cfd2cb;font-family:'Inter',system-ui,sans-serif;color:var(--ink);}
html[data-theme="dark"] body{background:#070a0c;}
a{color:inherit;text-decoration:none;}


/* ---------- Page shell (real site) ---------- */
.app{max-width:1080px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;}
@media (min-width:1120px){ .app{box-shadow:var(--shadow);} }
.loading{padding:90px 24px;text-align:center;color:var(--mute);
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;}
.iconbtn.theme svg{width:17px;height:17px;}
.card-prio b.ml{font-size:11px;letter-spacing:.06em;}
.trow-prio .ml{font-size:10px;letter-spacing:.05em;}


/* ---------- Masthead ---------- */
.masthead{background:var(--petrol);color:#eaf4f5;padding:14px 20px 0;}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;}
.brand h1{font-family:'Newsreader',serif;font-weight:600;font-size:25px;letter-spacing:.005em;margin:0;line-height:1;color:#fff;}
.dateline{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#9cc4c8;white-space:nowrap;text-transform:uppercase;}
.mast-tools{display:flex;align-items:center;gap:8px;}
.searchwrap{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.10);border-radius:9px;padding:7px 11px;min-width:0;}
.searchwrap input{background:transparent;border:0;outline:0;color:#eaf4f5;font-size:13px;width:150px;}
.searchwrap input::placeholder{color:#8fb6ba;}
.searchwrap svg{width:15px;height:15px;color:#9cc4c8;flex:none;}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10);color:#cfe6e8;}
.iconbtn:hover{background:rgba(255,255,255,.18);}
.iconbtn svg{width:18px;height:18px;}
/* masthead lower row: view tabs + region */
.mast-nav{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;border-top:1px solid rgba(255,255,255,.10);}
.viewtabs{display:flex;gap:2px;}
.viewtab{position:relative;font-family:'Inter';font-size:13.5px;font-weight:600;color:#a9cccf;background:transparent;border:0;cursor:pointer;
  padding:11px 4px 12px;margin-right:20px;display:flex;align-items:center;gap:8px;}
.viewtab .vt-ct{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:20px;}
.viewtab.on{color:#fff;}
.viewtab.on::after{content:"";position:absolute;left:0;right:20px;bottom:-1px;height:2px;background:var(--gold);}
.region-seg{display:inline-flex;background:rgba(255,255,255,.10);border-radius:9px;padding:3px;gap:2px;margin-bottom:9px;}
.region-seg button{font-family:'Inter';font-size:12.5px;font-weight:600;border:0;cursor:pointer;background:transparent;color:#bcd9dc;padding:7px 14px;border-radius:6px;display:flex;align-items:center;gap:6px;min-height:34px;}
.region-seg button .ct{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:20px;}
.region-seg button.on{background:#fff;color:var(--petrol-ink);}
.region-seg button.on .ct{background:var(--match-bg);color:var(--match);}
.region-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#9cc4c8;margin-bottom:13px;text-transform:uppercase;}

/* ---------- "since last check" sub-bar ---------- */
.checkbar{display:flex;align-items:center;gap:10px;padding:9px 20px;background:var(--card);border-bottom:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.03em;}
.checkbar .new-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--watch-bg);}
.checkbar .nnew{color:var(--ink);font-weight:600;}
.checkbar .seenbtn{margin-left:auto;font-family:'Inter';font-size:12px;font-weight:600;color:var(--link);background:transparent;border:0;cursor:pointer;}
.checkbar .seenbtn:hover{text-decoration:underline;}

/* ---------- Paper sheet ---------- */
.sheet{padding:20px;}

/* ---------- THE LEAD (signature) ---------- */
.lead{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);overflow:hidden;}
.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--match);}
.lead.is-watch::before{background:var(--watch);}
.lead-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.lead-eyebrow .rule{height:1px;flex:1;background:var(--line);}
.lead-body{display:flex;gap:24px;align-items:flex-start;}
.lead-left{flex:1;min-width:0;}
.lead-title{font-family:'Newsreader',serif;font-weight:600;font-size:25px;line-height:1.18;letter-spacing:.003em;margin:0 0 9px;color:var(--ink);}
.lead-title a:hover{color:var(--link);}
.lead-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:13px;}
.lead-meta .org{color:var(--ink);font-weight:500;}
.lead-reason{font-size:14.5px;line-height:1.62;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:14px;font-style:italic;font-family:'Newsreader',serif;}
.lead-right{flex:none;width:148px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.prio-dial{position:relative;width:118px;height:118px;}
.prio-dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.prio-dial .num b{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:var(--ink);line-height:1;}
.prio-dial .num span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;color:var(--mute);margin-top:3px;}
.dial-arc{animation:fillArc 1s cubic-bezier(.2,.8,.2,1) both;}
@keyframes fillArc{from{stroke-dashoffset:var(--c);}to{stroke-dashoffset:var(--off);}}
.lead-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}

/* ---------- Buttons ---------- */
.btn{font-family:'Inter';font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:40px;transition:.14s;}
.btn svg{width:15px;height:15px;}
.btn:hover{border-color:var(--ink-soft);}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff;}
.btn.primary:hover{background:var(--petrol-ink);}
.btn.on{background:var(--match-bg);border-color:var(--match);color:var(--match);}
.btn.gold.on{background:var(--watch-bg);border-color:var(--gold);color:var(--gold);}

/* ---------- Situation summary ---------- */
.summary{display:flex;align-items:stretch;gap:0;margin:18px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.stat{flex:1;padding:14px 16px;border-right:1px solid var(--line-soft);min-width:0;text-align:left;background:transparent;border-top:0;border-bottom:0;border-left:0;cursor:default;font-family:inherit;}
.stat.clickable{cursor:pointer;transition:.12s;} .stat.clickable:hover{background:var(--paper);}
.stat:last-child{border-right:0;flex:1.5;display:flex;align-items:center;gap:14px;cursor:default;}
.stat .num{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;line-height:1;color:var(--ink);}
.stat .num.go{color:var(--match);} .stat .num.wa{color:var(--watch);} .stat .num.ur{color:var(--urgent);}
.stat .lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-top:6px;}
.spark{flex:1;height:38px;}
.spark-lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;}

/* ---------- Controls bar (sticky) ---------- */
.controls{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 20px;margin:14px -20px 4px;background:var(--paper);border-bottom:1px solid var(--line);}
.tier-seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
.tier-seg button{font-family:'Inter';font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--ink-soft);padding:7px 13px;border-radius:6px;cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px;}
.tier-seg button .dot{width:7px;height:7px;border-radius:50%;}
.tier-seg button.on{background:var(--ink);color:var(--paper);}
.sortwrap{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.05em;}
.sortwrap select{font-family:'Inter';font-size:12.5px;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;min-height:36px;}
.controls .grow{flex:1;}
.ruled-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-weight:500;user-select:none;}
.ruled-toggle input{accent-color:var(--petrol);width:15px;height:15px;}

/* ---------- Day groups ---------- */
.group{margin-top:22px;}
.group-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;}
.group-date{font-family:'Newsreader',serif;font-weight:600;font-size:19px;color:var(--ink);letter-spacing:.005em;}
.group-rel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);}
.group-counts{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);}
.group-rule{height:1px;background:var(--line);margin-bottom:14px;}
.cards{display:flex;flex-direction:column;gap:11px;}

/* ---------- Job card ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px 15px 19px;display:flex;gap:16px;transition:box-shadow .16s,transform .16s,border-color .16s;animation:rise .34s ease both;animation-delay:var(--d,0ms);}
@keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--line);}
.card.t-strong::before{background:var(--match);}
.card.t-watch::before{background:var(--watch);}
.card:hover{border-color:var(--ink-soft);transform:translateY(-1px);}
.card.sel{box-shadow:0 0 0 2px var(--petrol),var(--shadow);border-color:var(--petrol);}
.card.is-applied{background:var(--match-bg);border-color:var(--match);}
.card.is-saved{box-shadow:inset 0 0 0 1px var(--gold);}
.card.flash{animation:flash .6s ease;}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--gold);}100%{box-shadow:inset 0 0 0 1px var(--gold);}}
.card-prio{flex:none;width:42px;text-align:center;padding-top:2px;}
.card-prio b{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ink-soft);line-height:1;}
.card-prio.go b{color:var(--match);} .card-prio.wa b{color:var(--watch);}
.card-prio span{display:block;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.13em;color:var(--mute);margin-top:5px;}
.card-main{flex:1;min-width:0;}
.card-titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.title-wrap{min-width:0;}
.card-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.32;}
.card-title a{display:inline;align-items:center;}
.card-title a:hover{color:var(--link);}
.card-title .ext{width:11px;height:11px;opacity:.4;display:inline-block;vertical-align:baseline;margin-left:3px;}
.tag-new{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.14em;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px;}
.card-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 11px;margin-top:6px;}
.card-meta .org{color:var(--ink-soft);font-weight:500;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;align-items:center;}
.deadline{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--watch-bg);color:var(--watch);text-transform:uppercase;}
.deadline.urgent{background:var(--urgent-bg);color:var(--urgent);}
.deadline.closed{background:transparent;color:var(--mute);border:1px dashed var(--line);}
.interest{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;}
.pips{display:inline-flex;gap:3px;}
.pip{width:6px;height:6px;border-radius:1.5px;background:var(--line);}
.pip.on{background:var(--gold);}
.card-reason{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-top:10px;}
.card-reason b{color:var(--ink);font-weight:600;}
.card-foot{display:flex;align-items:center;gap:14px;margin-top:11px;}
.fb{display:flex;align-items:center;gap:2px;}
.fb .fblabel{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-right:5px;}
.fbbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:var(--mute);background:transparent;border:1px solid transparent;transition:.12s;}
.fbbtn:hover{background:var(--paper);color:var(--ink);}
.fbbtn svg{width:15px;height:15px;}
.fbbtn.up.on{color:var(--match);background:var(--match-bg);}
.fbbtn.down.on{color:var(--urgent);background:var(--urgent-bg);}
.card-actions{display:flex;gap:4px;flex:none;}
.act{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:var(--mute);background:transparent;border:1px solid transparent;transition:.13s;}
.act:hover{background:var(--paper);color:var(--ink);}
.act svg{width:16px;height:16px;}
.act.save.on{color:var(--gold);} .act.applied.on{color:var(--match);}
.stamp{position:absolute;right:14px;bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--match);border:1px solid var(--match);border-radius:5px;padding:2px 7px;transform:rotate(-4deg);text-transform:uppercase;opacity:.85;}

/* ---------- Ruled-out block ---------- */
.ruled{margin-top:11px;border:1px dashed var(--line);border-radius:11px;}
.ruled summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.05em;color:var(--mute);}
.ruled summary::-webkit-details-marker{display:none;}
.ruled summary .chev{margin-left:auto;transition:.2s;}
.ruled[open] summary .chev{transform:rotate(90deg);}
.ruled .ruled-list{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px;}
.ruled-item{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--paper);}
.ruled-item .ri-main{flex:1;min-width:0;}
.ruled-item .rtitle{font-size:13px;color:var(--ink-soft);font-weight:500;}
.ruled-item .rtitle a:hover{color:var(--link);}
.ruled-item .rorg{color:var(--mute);}
.ruled-item .rwhy{font-size:11.5px;color:var(--mute);line-height:1.45;margin-top:3px;}
.dq{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--line-soft);color:var(--ink-soft);white-space:nowrap;}
.dq.closed{background:var(--urgent-bg);color:var(--urgent);}
.dq.interest5{background:var(--watch-bg);color:var(--gold);}
.ruled-item .rright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}

/* ---------- Tracked view ---------- */
.tracked-intro{font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:var(--ink-soft);margin:2px 0 18px;}
.track-group{margin-top:6px;margin-bottom:22px;}
.track-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.track-head .th-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:6px;}
.th-pill.applied{background:var(--match-bg);color:var(--match);}
.th-pill.saved{background:var(--watch-bg);color:var(--gold);}
.th-pill.dismissed{background:var(--line-soft);color:var(--mute);}
.track-head .th-ct{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);}
.track-head .th-rule{flex:1;height:1px;background:var(--line);}
.trow{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;transition:.14s;}
.trow:hover{border-color:var(--ink-soft);}
.trow.dismissed-row{opacity:.6;}
.trow.dismissed-row .trow-title{text-decoration:line-through;}
.trow-prio{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;width:34px;text-align:center;flex:none;color:var(--ink-soft);}
.trow-prio.go{color:var(--match);} .trow-prio.wa{color:var(--watch);}
.trow-main{flex:1;min-width:0;}
.trow-title{font-size:14px;font-weight:600;color:var(--ink);}
.trow-title a:hover{color:var(--link);}
.trow-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;}
.trow-meta .reg{color:var(--link);}
.trow-actions{display:flex;gap:5px;flex:none;}

/* ---------- Empty / quiet ---------- */
.quiet{text-align:center;padding:48px 20px;color:var(--mute);}
.quiet .ico{width:40px;height:40px;margin:0 auto 12px;color:var(--line);}
.quiet h3{font-family:'Newsreader',serif;font-weight:600;font-size:20px;color:var(--ink-soft);margin:0 0 5px;}
.quiet p{font-size:13px;margin:0;}

/* ---------- Keyboard help overlay ---------- */
.kbd-overlay{position:absolute;inset:0;background:rgba(8,12,14,.55);backdrop-filter:blur(2px);z-index:70;display:none;align-items:center;justify-content:center;padding:20px;}
.kbd-overlay.show{display:flex;}

    </div>

<script>
/* ============================================================
   Job Monitor — Daily Dispatch  (Phase 1: real data, both lanes)
   Reads ./data (Berlin) + ./data-london (London). Persists the
   user's pipeline + feedback + "seen" set in localStorage.
   Gracefully ranks legacy days (match tier) alongside scored days.
   ============================================================ */

/* ---------- safe storage (never throws; falls back to memory) ---------- */
const store=(function(){
  let ok=true; try{const k='__jm_t';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){ok=false;}
  const mem={};
  return {
    get(k){ try{ if(ok){const v=localStorage.getItem(k);return v===null?null:JSON.parse(v);} return (k in mem)?mem[k]:null; }catch(e){ return (k in mem)?mem[k]:null; } },
    set(k,v){ try{ if(ok)localStorage.setItem(k,JSON.stringify(v)); else mem[k]=v; }catch(e){ mem[k]=v; } }
  };
})();

/* ---------- config ---------- */
const LANES={berlin:'./data', london:'./data-london'};
const DAYS_WINDOW=14;

/* ---------- escaping ---------- */
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}

/* ---------- dates ---------- */
function todayMidnight(){const d=new Date();d.setHours(0,0,0,0);return d;}
const TODAY=todayMidnight();
const NO_DATE=/^(not specified|not given|n\/?a|none|null|ongoing|rolling|continuous|open( until filled)?|until filled|laufend|unbefristet|fortlaufend|tba|tbd|various|—|–|-)$/i;
function parseDeadlineISO(raw){
  const s=(raw||'').trim(); if(!s||NO_DATE.test(s))return null;
  let y,mo,da,m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)){ y=+m[1]; mo=+m[2]; da=+m[3]; }
  else if(m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})$/)){ da=+m[1]; mo=+m[2]; y=+m[3]; if(y<100)y+=2000; }
  else { const d=new Date(s); if(!isNaN(d)){ y=d.getFullYear(); mo=d.getMonth()+1; da=d.getDate(); } }
  if(!y||!mo||!da)return null;
  if(y<2024||y>2028)return null;               // clamp obviously-wrong years
  if(mo<1||mo>12||da<1||da>31)return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
}
function fmtUpdated(iso){const d=new Date(iso); if(isNaN(d))return '—';
  const dd=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return dd+' · '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+' UTC';}

/* ---------- map the real job schema → the card model ---------- */
function dqOf(j){
  const s=((j.reason||'')+' '+(j.type||'')+' '+(j.title||'')).toLowerCase();
  if(/working.?student|werkstudent|studentische|student assistant/.test(s))return 'Working-student';
  if(/\bintern\b|internship|praktik|trainee|volont/.test(s))return 'Internship';
  if(/\bph\.?d\b|doctora|doctoral|promotion|promoviert/.test(s))return 'PhD/doctorate';
  if(/\bsenior\b|\blead\b|head of|director|chief|leitung|geschäftsführ|vorstand|principal|\bmanager\b/.test(s))return 'Senior';
  if(/years? (of )?(professional |relevant )?experience|berufserfahrung|mindestens \d+ jahre/.test(s))return 'Experience';
  if(/software|developer|engineer|machine learning|\bml\b|data scien|programming|devops|kubernetes/.test(s))return 'Deep tech';
  if(/bar (exam|qualification)|legal qualification|rechtsanwalt|volljurist|\bassessor\b|chartered/.test(s))return 'Qualification';
  if(/native|mother ?tongue|muttersprache|verhandlungssicher|fluent in (?!english)/.test(s))return 'Language';
  if(/relocat|on-?site in|based in|vor ort|outside (the |your )?(target )?regio/.test(s))return 'Region';
  return 'Ruled out';
}
function mapJob(j,region){
  const hasPrio=typeof j.priority==='number';
  const mt=(j.match||'').toLowerCase();
  const rank=hasPrio?j.priority:(mt==='high'?72:(mt==='medium'||mt==='med')?50:mt==='low'?10:0);
  const elig=(typeof j.eligible==='boolean')?j.eligible:true;   // legacy days predate the gate → treat as eligible
  const iv=j.interest_score;
  const intNum=(typeof iv==='number'&&iv>=1&&iv<=5)?iv:null;
  return {region,
    t:j.title||'(untitled role)', o:j.organisation||'Unknown', url:j.url||'#',
    prio:rank, scored:hasPrio,
    matchLabel:mt==='high'?'HIGH':(mt==='medium'||mt==='med')?'MED':mt==='low'?'LOW':'',
    int:intNum, elig, loc:j.location||'', type:j.type||'', sal:j.salary||'',
    due:parseDeadlineISO(j.deadline), why:(j.reason||'').trim(), dq:elig?'':dqOf(j)};
}

/* ---------- state ---------- */
let DATA={berlin:{runs:0,updated:'—',days:[],coverage:null}, london:{runs:0,updated:'—',days:[],coverage:null}};
let REGION='berlin', VIEW='brief', TIER='all', SORT='priority', SHOW_RULED=false, QUERY='', selKey=null;
const userState=store.get('jm_userState')||{};
const fb=store.get('jm_fb')||{};
let seen=new Set();
let prevVisit=null;
let WORKER_PANEL=false;

/* apply persisted view settings (theme was already applied pre-paint) */
(function(){const s=store.get('jm_settings'); if(s){ if(s.REGION)REGION=s.REGION; if(s.VIEW)VIEW=s.VIEW;
  if(s.TIER)TIER=s.TIER; if(s.SORT)SORT=s.SORT; if(typeof s.SHOW_RULED==='boolean')SHOW_RULED=s.SHOW_RULED; }})();

function persist(){store.set('jm_userState',userState);store.set('jm_fb',fb);store.set('jm_seen',[...seen]);}
function persistSettings(){store.set('jm_settings',{REGION,VIEW,TIER,SORT,SHOW_RULED,dark:document.documentElement.dataset.theme==='dark'});}

/* ---------- lane access ---------- */
function keyOf(j){return j.region+'|'+j.o+'|'+j.t;}
function st(k){return userState[k]||{};}
function lane(region){return DATA[region].days.map(d=>({date:d.date, jobs:d.jobs.map(j=>({...j,region}))}));}
function allJobs(region){return lane(region).flatMap(d=>d.jobs);}
function everyJob(){return ['berlin','london'].flatMap(allJobs);}
function allKeys(){const ks=[];['berlin','london'].forEach(r=>DATA[r].days.forEach(d=>d.jobs.forEach(j=>ks.push(keyOf({...j,region:r})))));return ks;}
function isNew(j){return !seen.has(keyOf(j));}

/* ---------- helpers ---------- */
function daysUntil(due){ if(!due)return null; const d=new Date(due+'T00:00:00'); if(isNaN(d))return null; return Math.round((d-TODAY)/86400000); }
function deadlineChip(due){
  const n=daysUntil(due); if(n===null)return '';
  if(n<0)return `<span class="deadline closed">Closed</span>`;
  if(n===0)return `<span class="deadline urgent">Closes today</span>`;
  if(n<=3)return `<span class="deadline urgent">Closes in ${n}d</span>`;
  if(n<=10)return `<span class="deadline">Closes in ${n}d</span>`;
  const d=new Date(due+'T00:00:00'); return `<span class="deadline">Due ${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`;
}
function pips(n){let h='<span class="pips">';for(let i=1;i<=5;i++)h+=`<span class="pip ${i<=n?'on':''}"></span>`;h+='</span>';return h;}
function interestChip(j){return j.int?`<span class="interest">Interest ${pips(j.int)}</span>`:'';}
function tierOf(j){ if(!j.elig)return 'ruled'; if(j.prio>=55)return 'strong'; if(j.prio>=30)return 'watch'; return 'low'; }
function relDate(s){const d=new Date(s+'T00:00:00');const diff=Math.round((TODAY-d)/86400000);if(diff===0)return 'Today';if(diff===1)return 'Yesterday';if(diff<7)return diff+' days ago';return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fullDate(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function agoText(ts){ if(!ts)return 'your first visit'; const mins=Math.round((Date.now()-ts)/60000);
  if(mins<2)return 'moments ago'; if(mins<60)return mins+'m ago'; const h=Math.round(mins/60);
  if(h<24)return h+'h ago'; const d=Math.round(h/24); return d===1?'yesterday':d+' days ago'; }

const I={
  open:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 4h6m0 0v6m0-6L10 14M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4"/></svg>',

/* ---------- priority dial ---------- */
function dial(prio,tier){
  const r=52,c=2*Math.PI*r,off=c*(1-prio/100);
  const col=tier==='strong'?'var(--match)':tier==='watch'?'var(--watch)':'var(--ink-soft)';
  return `<div class="prio-dial"><svg viewBox="0 0 118 118">
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle class="dial-arc" cx="59" cy="59" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="--c:${c};--off:${off}" transform="rotate(-90 59 59)"/>
  </svg><div class="num"><b>${prio}</b><span>PRIORITY</span></div></div>`;
}

/* ---------- job card (Brief) ---------- */
function card(j,delay){
  const k=keyOf(j),s=st(k); if(s.dismissed)return '';
  const tier=tierOf(j), ek=encodeURIComponent(k);
  const cls=['card','t-'+tier]; if(s.applied)cls.push('is-applied'); if(s.saved)cls.push('is-saved'); if(k===selKey)cls.push('sel');
  const pc=tier==='strong'?'go':tier==='watch'?'wa':'lo';
  const meta=[`<span class="org">${esc(j.o)}</span>`]; if(j.loc)meta.push(esc(j.loc)); if(j.type)meta.push(esc(j.type)); if(j.sal&&j.sal!=='Not specified')meta.push(esc(j.sal));
  const fbk=fb[k];
  const chips=[deadlineChip(j.due),interestChip(j)].filter(Boolean).join('');
  const prioInner=j.scored?`<b>${j.prio}</b><span>PRIO</span>`:`<b class="ml">${j.matchLabel||'—'}</b><span>MATCH</span>`;
  return `<div class="${cls.join(' ')}" data-key="${ek}" style="--d:${delay}ms">
    <div class="card-prio ${pc}">${prioInner}</div>
    <div class="card-main">
      <div class="card-titlerow">
        <div class="title-wrap"><div class="card-title">${isNew(j)?'<span class="tag-new">New</span>':''}<a href="${j.url}" target="_blank" rel="noopener">${esc(j.t)}${I.ext}</a></div></div>
        <div class="card-actions">
          <button class="act save ${s.saved?'on':''}" title="Save (s)" onclick="act('save',this)" data-key="${ek}">${s.saved?I.saveOn:I.save}</button>
          <button class="act applied ${s.applied?'on':''}" title="Mark applied (a)" onclick="act('applied',this)" data-key="${ek}">${I.applied}</button>
          <button class="act dismiss" title="Dismiss (x)" onclick="act('dismiss',this)" data-key="${ek}">${I.dismiss}</button>
        </div>
      </div>
      <div class="card-meta">${meta.join('<span style="opacity:.45">·</span>')}</div>
      ${chips?`<div class="chips">${chips}</div>`:''}
      ${j.why?`<div class="card-reason">${esc(j.why)}</div>`:''}
      <div class="card-foot">
        <div class="fb"><span class="fblabel">Good match?</span>
          <button class="fbbtn up ${fbk==='up'?'on':''}" title="Good match (u)" onclick="feedback(this,'up')" data-key="${ek}">${I.up}</button>
          <button class="fbbtn down ${fbk==='down'?'on':''}" title="Not for me (d)" onclick="feedback(this,'down')" data-key="${ek}">${I.down}</button>
        </div>
      </div>
    </div>
    ${s.applied?'<span class="stamp">Applied</span>':''}
  </div>`;
}

/* ---------- ruled-out block ---------- */
function ruledBlock(list){
  if(!list.length)return '';
  const items=list.map(j=>{
    const closed=daysUntil(j.due)!==null&&daysUntil(j.due)<0;
    const tags=[];
    if(j.dq)tags.push(`<span class="dq">${esc(j.dq)}</span>`);
    if(closed)tags.push(`<span class="dq closed">Closed</span>`);
    if(j.int&&j.int>=5)tags.push(`<span class="dq interest5">Interest 5</span>`);
    return `<div class="ruled-item">
      <div class="ri-main">
        <div class="rtitle"><a href="${j.url}" target="_blank" rel="noopener">${esc(j.t)}</a> <span class="rorg">· ${esc(j.o)}</span></div>
        <div class="rwhy">${esc(j.why)}</div>
      </div>
      <div class="rright">${tags.join('')}</div>
    </div>`;
  }).join('');
  return `<details class="ruled" ${SHOW_RULED?'open':''}>
    <summary>${list.length} ruled out — reason shown per role
      <svg class="chev" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></summary>
    <div class="ruled-list">${items}</div></details>`;
}

/* ---------- filter / sort ---------- */
function passes(j){
  if(QUERY){const q=QUERY.toLowerCase(); if(!(j.t.toLowerCase().includes(q)||j.o.toLowerCase().includes(q)))return false;}
  if(TIER==='strong')return j.elig&&tierOf(j)==='strong';
  if(TIER==='watch')return j.elig&&(tierOf(j)==='strong'||tierOf(j)==='watch');
  return true;
}
function sortJobs(a,b){
  if(SORT==='closing'){const na=daysUntil(a.due),nb=daysUntil(b.due);const va=na===null||na<0?9999:na,vb=nb===null||nb<0?9999:nb;if(va!==vb)return va-vb;}
  if(SORT==='interest'){const ai=a.int||0,bi=b.int||0;if(bi!==ai)return bi-ai;}
  return b.prio-a.prio;
}

/* ---------- sparkline (real per-day eligible counts) ---------- */
function sparkline(region){
  const days=DATA[region].days.slice().reverse();           // oldest → newest
  const series=days.map(d=>d.jobs.filter(j=>j.elig).length);
  if(series.length<2)return '';
  const w=150,h=30,max=Math.max(1,...series),step=w/(series.length-1);
  const pts=series.map((v,i)=>`${(i*step).toFixed(1)},${(h-(v/max)*(h-4)-2).toFixed(1)}`);
  const last=series.length-1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="var(--petrol)" stroke-width="1.5" stroke-linejoin="round" points="${pts.join(' ')}" opacity=".55"/>
    <circle cx="${(last*step).toFixed(1)}" cy="${(h-(series[last]/max)*(h-4)-2).toFixed(1)}" r="2.5" fill="var(--gold)"/></svg>`;
}

      <div class="viewtabs">
        <button class="viewtab ${VIEW==='brief'?'on':''}" onclick="setView('brief')">Brief</button>
        <button class="viewtab ${VIEW==='tracked'?'on':''}" onclick="setView('tracked')">Tracked <span class="vt-ct">${trackedCt}</span></button>
        <button class="viewtab ${VIEW==='sources'?'on':''} ${problemCt>0?'alert':''}" onclick="setView('sources')">Sources${problemCt>0?` <span class="vt-ct">${problemCt}</span>`:''}</button>

/* ---------- Brief view ---------- */
function briefView(){
  const L=DATA[REGION], jobs=allJobs(REGION), elig=jobs.filter(j=>j.elig);
  if(!L.days.length){
    return `<div class="sheet"><div class="quiet"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><h3>No data loaded for ${REGION==='berlin'?'Berlin':'London'} yet</h3><p>Either no runs have published here, or the data couldn’t be reached. Try the other region.</p></div></div>`;
  }
  /* Lead prefers a genuinely scored role over a high legacy-match one */
  const scored=elig.filter(j=>j.scored);
  const lead=(scored.length?scored:elig).slice().sort((a,b)=>b.prio-a.prio)[0];
  const strongN=elig.filter(j=>tierOf(j)==='strong').length;
  const watchN=elig.filter(j=>tierOf(j)==='watch').length;
  const closingN=jobs.filter(j=>{const n=daysUntil(j.due);return j.elig&&n!==null&&n>=0&&n<=7;}).length;
  const newN=jobs.filter(j=>isNew(j)&&!st(keyOf(j)).dismissed&&j.elig).length;

  let html='';
  if(newN>0){
    html+=`<div class="checkbar"><span class="new-dot"></span><span><span class="nnew">${newN} new</span> since your last check · ${agoText(prevVisit)}</span><button class="seenbtn" onclick="markSeen()">Mark all seen</button></div>`;
  }
  html+=`<div class="sheet">`;

  if(lead){
    const lt=tierOf(lead),k=keyOf(lead),s=st(k),ek=encodeURIComponent(k);
    const meta=[`<span class="org">${esc(lead.o)}</span>`]; if(lead.loc)meta.push(esc(lead.loc)); if(lead.type)meta.push(esc(lead.type)); if(lead.sal&&lead.sal!=='Not specified')meta.push(esc(lead.sal));
    html+=`<div class="lead ${lt==='watch'?'is-watch':''}">
      <div class="lead-eyebrow">Today's lead<span class="rule"></span>${deadlineChip(lead.due)}</div>
      <div class="lead-body">
        <div class="lead-left">
          <h2 class="lead-title"><a href="${lead.url}" target="_blank" rel="noopener">${esc(lead.t)}</a></h2>
          <div class="lead-meta">${meta.join('<span style="opacity:.4">·</span>')}${lead.int?`<span style="opacity:.4">·</span><span class="interest">Interest ${pips(lead.int)}</span>`:''}</div>
          ${lead.why?`<p class="lead-reason">${esc(lead.why)}</p>`:''}
          <div class="lead-actions">
            <a class="btn primary" href="${lead.url}" target="_blank" rel="noopener">${I.open} Open posting</a>
            <button class="btn gold ${s.saved?'on':''}" onclick="act('save',this);render()" data-key="${ek}">${I.save} ${s.saved?'Saved':'Save'}</button>
            <button class="btn ${s.applied?'on':''}" onclick="act('applied',this);render()" data-key="${ek}">${I.applied} ${s.applied?'Applied':'Mark applied'}</button>
          </div>
        </div>
        <div class="lead-right">${dial(lead.prio,lt)}</div>
      </div></div>`;
  }

  html+=`<div class="summary">
    <button class="stat clickable" onclick="setTier('all')"><div class="num">${jobs.length}</div><div class="lbl">In window</div></button>
    <button class="stat clickable" onclick="setTier('strong')"><div class="num go">${strongN}</div><div class="lbl">Strong ≥55</div></button>
    <button class="stat clickable" onclick="setTier('watch')"><div class="num wa">${watchN}</div><div class="lbl">To watch</div></button>
    <div class="stat">
      <button class="stat clickable" style="border:0;padding:0;flex:none" onclick="setSort('closing')"><div class="num ur">${closingN}</div><div class="lbl">Closing ≤7d</div></button>
      <div style="flex:1"><div class="spark-lbl">${L.days.length}-day activity</div>${sparkline(REGION)}</div>
    </div>
  </div>`;

  html+=`<div class="controls">
    <div class="tier-seg">
      <button class="${TIER==='strong'?'on':''}" onclick="setTier('strong')"><span class="dot" style="background:var(--match)"></span>Strong</button>
      <button class="${TIER==='watch'?'on':''}" onclick="setTier('watch')"><span class="dot" style="background:var(--watch)"></span>Watch</button>
      <button class="${TIER==='all'?'on':''}" onclick="setTier('all')"><span class="dot" style="background:var(--ink-soft)"></span>All</button>
    </div>
    <span class="grow"></span>
    <div class="sortwrap">Sort<select onchange="setSort(this.value)">
      <option value="priority" ${SORT==='priority'?'selected':''}>Priority</option>
      <option value="closing" ${SORT==='closing'?'selected':''}>Closing soon</option>
      <option value="interest" ${SORT==='interest'?'selected':''}>Interest</option>
    </select></div>
    <label class="ruled-toggle"><input type="checkbox" ${SHOW_RULED?'checked':''} onchange="setRuled(this.checked)">Show ruled-out</label>
  </div>`;

  VISIBLE=[]; KEYMAP={};
  let any=false,delay=0;
  lane(REGION).forEach(day=>{
    const e=day.jobs.filter(j=>j.elig&&passes(j)&&!st(keyOf(j)).dismissed).sort(sortJobs);
    const ruled=day.jobs.filter(j=>!j.elig&&passes(j)&&!st(keyOf(j)).dismissed);
    if(e.length===0&&(!SHOW_RULED||ruled.length===0))return;
    any=true;
    const counts=`${e.length} shown${ruled.length?` · ${ruled.length} ruled out`:''}`;
    let cardsHtml='';
    e.forEach(j=>{const k=keyOf(j);VISIBLE.push(k);KEYMAP[k]=j;cardsHtml+=card(j,Math.min(delay,560));delay+=45;});
    html+=`<div class="group">
      <div class="group-head"><span class="group-date">${fullDate(day.date)}</span><span class="group-rel">${relDate(day.date)}</span><span class="group-counts">${counts}</span></div>
      <div class="group-rule"></div>
      <div class="cards">${cardsHtml}</div>
      ${SHOW_RULED?ruledBlock(ruled):''}
    </div>`;
  });
  if(!any){html+=`<div class="quiet"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg><h3>Nothing matches this filter</h3><p>Widen to “All”, clear the search, or switch region.</p></div>`;}
  html+=`</div>`;
  if(!VISIBLE.includes(selKey))selKey=VISIBLE[0]||null;
  return html;
}

/* ---------- Tracked view (cross-region pipeline) ---------- */
function trackedView(){
  const jobs=everyJob();
  const byKey={}; jobs.forEach(j=>byKey[keyOf(j)]=j);
  const applied=[],saved=[],dismissed=[];
  Object.keys(userState).forEach(k=>{const s=userState[k],j=byKey[k];if(!j)return;
    if(s.applied)applied.push(j); else if(s.saved)saved.push(j); else if(s.dismissed)dismissed.push(j);});
  const byPrio=(a,b)=>b.prio-a.prio;
  applied.sort(byPrio);saved.sort(byPrio);dismissed.sort(byPrio);

  let html=`<div class="sheet">
    <p class="tracked-intro">Your pipeline across both regions — what you’ve shortlisted, applied to, and ruled out by hand.</p>`;
  const block=(title,cls,list)=>{
    if(!list.length)return '';
    let rows=list.map(j=>{
      const k=keyOf(j),ek=encodeURIComponent(k),pc=tierOf(j)==='strong'?'go':tierOf(j)==='watch'?'wa':'';
      const meta=[`<span class="reg">${j.region==='berlin'?'Berlin':'London'}</span>`,esc(j.o)]; if(j.loc)meta.push(esc(j.loc));
      const dl=deadlineChip(j.due);
      const prioCell=j.scored?j.prio:`<span class="ml">${j.matchLabel||'—'}</span>`;
      const actions = cls==='dismissed'
        ? `<button class="act" title="Restore" onclick="reopen(this)" data-key="${ek}">${I.save}</button>`
        : `<a class="act" title="Open" href="${j.url}" target="_blank" rel="noopener">${I.open}</a>
           ${cls==='saved'?`<button class="act applied" title="Mark applied" onclick="act('applied',this);render()" data-key="${ek}">${I.applied}</button>`:''}
           <button class="act" title="Remove" onclick="act('dismiss',this);render()" data-key="${ek}">${I.dismiss}</button>`;
      return `<div class="trow ${cls==='dismissed'?'dismissed-row':''}">
        <div class="trow-prio ${pc}">${prioCell}</div>
        <div class="trow-main"><div class="trow-title"><a href="${j.url}" target="_blank" rel="noopener">${esc(j.t)}</a></div>
          <div class="trow-meta">${meta.join('<span>·</span>')}${dl?'<span>·</span>'+dl:''}</div></div>
        <div class="trow-actions">${actions}</div></div>`;
    }).join('');
    return `<div class="track-group"><div class="track-head"><span class="th-pill ${cls}">${title}</span><span class="th-ct">${list.length}</span><span class="th-rule"></span></div>${rows}</div>`;
  };
  if(!applied.length&&!saved.length&&!dismissed.length){
    html+=`<div class="quiet"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><h3>Nothing tracked yet</h3><p>Save or mark roles as applied from the Brief, and they’ll collect here.</p></div>`;
  } else {
    html+=block('Applied','applied',applied)+block('Saved','saved',saved)+block('Dismissed','dismissed',dismissed);
  }
  html+=`</div>`;
  return html;
}

/* ---------- Sources / coverage view ---------- */
function fmtDay(iso){const d=new Date(iso);if(isNaN(d))return '';return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function relWhen(iso){const d=new Date(iso);if(isNaN(d))return '';const mins=Math.round((Date.now()-d)/60000);if(mins<1)return 'just now';if(mins<60)return mins+'m ago';const h=Math.round(mins/60);if(h<24)return h+'h ago';const dd=Math.round(h/24);return dd===1?'yesterday':dd+' days ago';}
function orgHasEligibleRole(region,siteName){
  const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
  const a=norm(siteName); if(a.length<4)return false;
  return allJobs(region).some(j=>{ if(!j.elig)return false; const b=norm(j.o); return b.length>=4 && (a===b||a.indexOf(b)>=0||b.indexOf(a)>=0); });
}
function laneProblems(){
  const out=[];
  [['berlin','Berlin'],['london','London']].forEach(([rk,label])=>{
    const cov=DATA[rk].coverage; if(!cov||!Array.isArray(cov.sites))return;
    cov.sites.forEach(s=>out.push(Object.assign({},s,{lane:label,regionKey:rk,tie:orgHasEligibleRole(rk,s.name)})));
  });
  return out.sort((a,b)=>((a.status!=='paused')-(b.status!=='paused'))||((b.consecutive_failures||0)-(a.consecutive_failures||0)));
}
function srow(s){
  const status=s.status||'erroring';
  const failTxt = status==='paused' ? `${s.consecutive_failures||0} fails` : `${s.consecutive_failures||0}×`;
  const since = s.last_failure?relWhen(s.last_failure):'';
  const pausedTxt = (status==='paused'&&s.paused_until)?` · until ${fmtDay(s.paused_until)}`:'';
  const actions = `<button class="s-btn" onclick="retry(${s.id||0})">${I.retry} Retry</button>`+(s.url?`<a class="s-btn" href="${s.url}" target="_blank" rel="noopener">${I.ext} Visit</a>`:'');
  return `<div class="srow ${status}">
    <div class="s-status"><span class="s-pill ${status}">${esc(status)}</span><div class="s-fail">${failTxt}</div></div>
    <div class="s-main">
      <div class="s-name">${esc(s.name)}${s.tie?'<span class="lead-tie">behind a role</span>':''}</div>
      <div class="s-meta"><span class="mid">#${s.id}</span><span>${esc(s.lane)}</span><span>${esc(s.method||'')}</span>${since?`<span>since ${since}${pausedTxt}</span>`:''}</div>
      ${s.message?`<div class="s-err"><span class="etype">${esc(s.last_type||'error')}</span> — ${esc(s.message)}</div>`:''}
    </div>
    <div class="s-actions">${actions}</div>
  </div>`;
}
/* ---------- one-click retry via Cloudflare Worker ---------- */
function getWorker(){ const w=store.get('jm_worker'); return (w&&w.url&&w.secret)?w:null; }
function toggleWorkerPanel(){ WORKER_PANEL=!WORKER_PANEL; render(); if(WORKER_PANEL){const i=document.getElementById('wkr-url'); if(i)i.focus();} }
function disconnectWorker(){ store.set('jm_worker',null); WORKER_PANEL=false; render(); toast('One-click retry disconnected'); }
function saveWorkerFromPanel(){
  const url=(document.getElementById('wkr-url').value||'').trim().replace(/\/+$/,'');
  const secret=(document.getElementById('wkr-secret').value||'').trim();
  if(!url||!secret){ toast('Enter both the Worker URL and passphrase'); return; }
  store.set('jm_worker',{url,secret}); WORKER_PANEL=false; render(); toast('One-click retry connected',true);
}
async function testWorker(){
  const url=(document.getElementById('wkr-url').value||'').trim().replace(/\/+$/,'');
  const secret=(document.getElementById('wkr-secret').value||'').trim();
  if(!url||!secret){ toast('Enter both fields first'); return; }
  toast('Testing connection…');
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},body:JSON.stringify({action:'ping'})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok) toast('Connection OK — authenticated',true);
    else if(r.status===401) toast('Reached the Worker, but the passphrase was rejected');
    else toast('Test failed: '+(d.error||('HTTP '+r.status)));
  }catch(e){ toast('Could not reach the Worker — check the URL / CORS origin'); }
}
function workerPanel(){
  const w=store.get('jm_worker')||{};
  return `<div class="wkr-panel">
    <div class="wkr-row"><label>Worker URL</label><input id="wkr-url" placeholder="https://jm-retry.you.workers.dev" value="${escAttr(w.url||'')}"></div>
    <div class="wkr-row"><label>Passphrase</label><input id="wkr-secret" type="password" placeholder="the DASHBOARD_SECRET you set on the Worker" value="${escAttr(w.secret||'')}"></div>
    <div class="wkr-actions">
      <button class="s-btn primary" onclick="saveWorkerFromPanel()">Save</button>
      <button class="s-btn" onclick="testWorker()">Test</button>
      ${w.url?`<button class="s-btn" onclick="disconnectWorker()">Disconnect</button>`:''}
      <span class="wkr-hint">Stored only in this browser — never written into the page.</span>
    </div>
  </div>`;
}
async function retry(id){
  const w=getWorker();
  if(!w){ toast(`Manual retry: GitHub → Actions → Run workflow → force_site_id ${id}`); WORKER_PANEL=true; render(); return; }
  toast(`Re-queueing site #${id}…`);
  try{
    const r=await fetch(w.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+w.secret},body:JSON.stringify({action:'retry',site_id:id,ignore_pause:true})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok) toast(`Re-queued #${id} — a targeted sweep is starting`,true);
    else if(r.status===401) toast('Retry rejected — reconnect with the right passphrase');
    else toast('Retry failed: '+(d.error||('HTTP '+r.status)));
  }catch(e){ toast('Retry failed — could not reach the Worker'); }
}
function sourcesView(){
  const B=DATA.berlin.coverage, L=DATA.london.coverage;
  if(!B&&!L){
    return `<div class="sheet"><div class="quiet"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><h3>No coverage data yet</h3><p>Source health is written on the monitor’s next run, then published here.</p></div></div>`;
  }
  const b=B||{},l=L||{};
  const total=(b.total_sites||0)+(l.total_sites||0);
  const healthy=(b.healthy||0)+(l.healthy||0);
  const erroring=(b.erroring||0)+(l.erroring||0);
  const paused=(b.paused||0)+(l.paused||0);
  const probs=laneProblems();
  const methods={}; [b,l].forEach(c=>Object.entries(c.methods||{}).forEach(([m,n])=>methods[m]=(methods[m]||0)+n));
  const names=[...(b.healthy_names||[]),...(l.healthy_names||[])];
  const tied=probs.filter(p=>p.tie);

  let html=`<div class="sheet">`;
  if(tied.length){
    const orgs=tied.map(p=>`<span class="src">${esc(p.name)}</span>`).join(', ');
    html+=`<div class="alertbar"><span class="ab-ico">${I.warn}</span><div class="ab-txt"><b>${tied.length} source${tied.length>1?'s':''} behind your current roles ${tied.length>1?'are':'is'} down.</b> Roles from ${orgs} may be stale — ${tied.length>1?'their scrapers are':'its scraper is'} erroring or paused, so new or closed postings could be missed. Worth a manual check.</div></div>`;
  }
  html+=`<div class="cov">
    <div class="c"><div class="cn">${total}</div><div class="cl">Sources tracked</div></div>
    <div class="c"><div class="cn ok">${healthy}</div><div class="cl">Healthy</div></div>
    <div class="c"><div class="cn err">${erroring}</div><div class="cl">Erroring</div></div>
    <div class="c"><div class="cn pause">${paused}</div><div class="cl">Paused</div></div>
  </div>`;
  if(total){
    const wOk=(healthy/total*100).toFixed(1),wErr=(erroring/total*100).toFixed(1),wP=(paused/total*100).toFixed(1);
    html+=`<div class="healthbar"><i class="hb-ok" style="width:${wOk}%"></i><i class="hb-err" style="width:${wErr}%"></i><i class="hb-pause" style="width:${wP}%"></i></div>
    <div class="healthbar-legend">
      <span><span class="lg-dot" style="background:var(--match)"></span>${healthy} healthy</span>
      <span><span class="lg-dot" style="background:var(--watch)"></span>${erroring} erroring</span>
      <span><span class="lg-dot" style="background:var(--urgent)"></span>${paused} paused</span>
    </div>`;
  }
  if(probs.length){
    const _conn=getWorker()?`<button class="s-btn on" onclick="toggleWorkerPanel()">One-click retry: on</button>`:`<button class="s-btn" onclick="toggleWorkerPanel()">Connect one-click retry</button>`;
    html+=`<div class="sec-head"><span class="sec-title">Needs attention</span><span class="sec-sub">${probs.length} source${probs.length>1?'s':''} · sorted by severity</span><span style="margin-left:auto">${_conn}</span></div><div class="sec-rule"></div>`;
    if(WORKER_PANEL) html+=workerPanel();
    html+=probs.map(srow).join('');
  } else {
    html+=`<div class="sec-head"><span class="sec-title">All sources healthy</span><span class="sec-sub">no errors on the last sweep</span></div><div class="sec-rule"></div><div class="quiet" style="padding:26px 20px"><p>Every configured source responded on the last run.</p></div>`;
  }
  const methodChips=Object.entries(methods).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<span class="method-chip"><b>${n}</b> ${esc(m)}</span>`).join('');
  const SHOWN=36;
  const nameChips=names.slice(0,SHOWN).map(n=>`<span class="name-chip">${esc(n)}</span>`).join('')+(names.length>SHOWN?`<span class="h-more">+${names.length-SHOWN} more</span>`:'');
  html+=`<details class="healthy">
    <summary><span class="h-dot"></span><span class="h-lab">${healthy} healthy source${healthy===1?'':'s'}</span><span class="h-sub">${names.length} listed</span>
      <svg class="chev" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></summary>
    <div class="h-body"><div class="h-methods">${methodChips}</div><div class="h-names">${nameChips}</div></div></details>`;
  html+=`</div>`;
  return html;
}

/* ---------- main render ---------- */
let VISIBLE=[],KEYMAP={};
function render(){
  const html=masthead()+(VIEW==='brief'?briefView():VIEW==='sources'?sourcesView():trackedView())
    +`<div class="foot"><span>© 2026 Moritz Engel</span><span>Evaluated by Claude · <span class="kbd-hint" onclick="toggleHelp()">? shortcuts</span></span></div>`;
  document.getElementById('app-content').innerHTML=html;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg,ok){
  const el=document.getElementById('toast'); if(!el)return;
  el.innerHTML=(ok?`<span class="t-ico">${I.applied}</span>`:'')+`<span>${esc(msg)}</span>`;
  el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1700);
}

/* ---------- interactions ---------- */
function setRegion(r){REGION=r;selKey=null;persistSettings();render();}
function setView(v){VIEW=v;persistSettings();render();}
function setTier(t){TIER=t;persistSettings();render();}
function setSort(s){SORT=s;persistSettings();render();}
function setRuled(v){SHOW_RULED=v;persistSettings();render();}
function toggleTheme(){const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';persistSettings();render();}
function markSeen(){allKeys().forEach(k=>seen.add(k));persist();render();toast('Marked all as seen');}

let searchT;
function onSearch(v){
  QUERY=v;
  clearTimeout(searchT);
  searchT=setTimeout(()=>{ render(); const i=document.getElementById('q'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} },170);
}
function act(kind,btn){
  const k=decodeURIComponent(btn.dataset.key),s=userState[k]||(userState[k]={});
  if(kind==='dismiss'){s.dismissed=true;s.saved=false;s.applied=false;toast('Dismissed');}
  else if(kind==='save'){s.saved=!s.saved;if(s.saved){s.dismissed=false;}toast(s.saved?'Saved to pipeline':'Removed from saved');}
  else if(kind==='applied'){s.applied=!s.applied;if(s.applied){s.dismissed=false;s.saved=false;}toast(s.applied?'Marked as applied':'Unmarked',s.applied);}
  seen.add(k);
  persist(); render();
}
function feedback(btn,dir){
  const k=decodeURIComponent(btn.dataset.key);
  fb[k]=fb[k]===dir?undefined:dir;
  persist(); render();
  if(fb[k])toast(dir==='up'?'Noted — more like this':'Noted — fewer like this');
}
function reopen(btn){const k=decodeURIComponent(btn.dataset.key);const s=userState[k];if(s){s.dismissed=false;}persist();render();toast('Restored to saved');}
function toggleHelp(){const o=document.getElementById('kbd');if(o)o.classList.toggle('show');}

/* ---------- keyboard navigation ---------- */
function moveSel(delta){
  if(VIEW!=='brief'||!VISIBLE.length)return;
  let i=VISIBLE.indexOf(selKey); if(i<0)i=0; i=Math.max(0,Math.min(VISIBLE.length-1,i+delta));
  selKey=VISIBLE[i]; render();
  const el=document.querySelector('.card.sel'); if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function selJob(){return KEYMAP[selKey];}
function doOnSel(kind){
  if(!selKey)return; const j=selJob(); if(!j)return;
  if(kind==='open'){ if(j.url&&j.url!=='#')window.open(j.url,'_blank'); else toast('No link for this posting'); return; }
  const fake={dataset:{key:encodeURIComponent(selKey)}};
  if(kind==='save'||kind==='applied'||kind==='dismiss')act(kind,fake);
  if(kind==='up'||kind==='down')feedback(fake,kind);
  setTimeout(()=>{const el=document.querySelector('.card.sel');if(el){el.classList.add('flash');}},10);
}
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'){ if(e.key==='Escape')e.target.blur(); return; }
  if(e.key==='?'){e.preventDefault();toggleHelp();return;}
  if(e.key==='Escape'){const o=document.getElementById('kbd');if(o)o.classList.remove('show');return;}
  if(e.key==='/'){e.preventDefault();const i=document.getElementById('q');if(i)i.focus();return;}
  if(VIEW!=='brief')return;
  switch(e.key){
    case 'j': case 'ArrowDown': e.preventDefault(); moveSel(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); moveSel(-1); break;
    case 'g': e.preventDefault(); selKey=VISIBLE[0]||null; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'o': case 'Enter': e.preventDefault(); doOnSel('open'); break;
    case 's': e.preventDefault(); doOnSel('save'); break;
    case 'a': e.preventDefault(); doOnSel('applied'); break;
    case 'x': e.preventDefault(); doOnSel('dismiss'); break;
    case 'u': e.preventDefault(); doOnSel('up'); break;
    case 'd': e.preventDefault(); doOnSel('down'); break;
  }
});

/* ---------- boot: fetch both lanes, seed "seen", render ---------- */
async function loadLane(region, base){
  // coverage.json (source health) — independent of the day data
  try{ const cr=await fetch(`${base}/coverage.json?t=${Date.now()}`); if(cr.ok) DATA[region].coverage=await cr.json(); }catch(e){}
  // day data
  try{
    const dres=await fetch(`${base}/dates.json?t=${Date.now()}`);
    if(dres.ok){
      let dates=await dres.json();
      dates=(Array.isArray(dates)?dates:[]).slice().sort().reverse().slice(0,DAYS_WINDOW);
      const results=await Promise.all(dates.map(async d=>{
        try{const r=await fetch(`${base}/${d}.json?t=${Date.now()}`); if(!r.ok)return null; return {date:d,data:await r.json()};}
        catch(e){return null;}
      }));
      const ok=results.filter(Boolean);
      DATA[region].days=ok.map(r=>({date:r.date, jobs:(r.data.jobs||[]).map(j=>mapJob(j,region))}));
      const latest=ok[0];
      DATA[region].runs = latest&&typeof latest.data.run_count==='number'?latest.data.run_count:0;
      DATA[region].updated = latest&&latest.data.generated_at?fmtUpdated(latest.data.generated_at):(DATA[region].days[0]?fullDate(DATA[region].days[0].date):'—');
    }
  }catch(e){ /* leave the empty lane in place */ }
}
async function boot(){
  await Promise.all([loadLane('berlin',LANES.berlin), loadLane('london',LANES.london)]);
  const keysNow=allKeys();
  const stored=store.get('jm_seen');
  if(stored===null){ seen=new Set(keysNow); }                 // first visit ever → nothing is "new"
  else { const setNow=new Set(keysNow); seen=new Set(stored.filter(k=>setNow.has(k))); }  // prune to current
  store.set('jm_seen',[...seen]);
  prevVisit=store.get('jm_lastVisit'); store.set('jm_lastVisit',Date.now());
  render();
}
boot();
</script>
