name: Probe Die Linke

# Manual, read-only diagnostic. Runs probe_dielinke.py ON the GitHub (Azure)
# runner — the same egress that production uses — and reports which fetch
# transport, if any, can retrieve a site that is being blocked from cloud IPs.
# Commits nothing, sends nothing, makes no LLM calls.
#
# Defaults to the Die Linke party page (config-de.json id 223). The target is an
# input, so this doubles as a generic "which transport beats this block?" probe
# for any future site that gets 403/429'd from the runner.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to probe (default: the Die Linke party careers page)"
        type: string
        default: "https://www.die-linke.de/partei/jobs/"
      selector:
        description: "CSS selector the production config extracts (id 223 uses .content)"
        type: string
        default: ".content"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read          # diagnostic only — never writes to the repo
    concurrency:
      group: probe-dielinke
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reuse the SAME cache key as the Job Monitor workflow so the Chromium
      # binary the main runs already downloaded is reused here — no 150MB fetch.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Probe transports
        env:
          # Only what the probe actually uses. TELEGRAM_/ANTHROPIC_ are NOT
          # passed — probe_dielinke.py setdefaults them so monitor.py imports
          # without them, and the probe never touches Telegram or the LLM.
          CONFIG_FILE: config-de.json
          PROBE_URL: ${{ inputs.target_url }}
          PROBE_SELECTOR: ${{ inputs.selector }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python -u probe_dielinke.py
