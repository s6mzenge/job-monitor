name: Diag Böll

# Manual run only. Probes which transport gets past Böll's 503 from the runner's
# IP, reading CF_WORKER_URL / CF_WORKER_TOKEN from repo secrets (you don't need to
# know the token). Trigger from the Actions tab -> "Diag Böll" -> "Run workflow",
# then read the log. Reusable for other blocked sites via the inputs below.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Listing URL to probe"
        required: false
        default: "https://www.boell.de/de/jobs-der-heinrich-boell-stiftung"
      detail_url:
        description: "A detail-page URL to probe"
        required: false
        default: "https://www.boell.de/de/2026/06/26/studentische-teilzeitkraft-archiv-gruenes-gedaechtnis-wmdka"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (same as production)
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install chromium --with-deps

      - name: Run Böll transport probe
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          BOELL_URL: ${{ github.event.inputs.url }}
          BOELL_DETAIL_URL: ${{ github.event.inputs.detail_url }}
        run: python -u diag_boell.py
