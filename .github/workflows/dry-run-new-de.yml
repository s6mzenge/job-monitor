name: Dry-run new DE sites

# Manual-only. Exercises the 13 new German candidate sites (ids 232–244) on the
# real Azure runner — same OS, same Python, same Playwright/curl_cffi stack and
# the same egress IPs production uses — so "does it fetch + extract here?" is
# answered for real, not just on your laptop.
#
# It is deliberately side-effect-free:
#   • dry_run.txt is written first  → monitor.py makes NO LLM calls and sends NO
#     Telegram (see the DRY_RUN branch in monitor.py).
#   • FORCE_SITE_IDS restricts the run to ONLY the targeted ids — the other 79
#     DE sites are skipped.
#   • STATE / ISSUES / SITE_DATA_DIR all point at throwaway paths, and there is
#     NO commit/push step and NO `contents: write` permission, so state-de.json,
#     the dashboard data and main are never touched. The seeded throwaway state
#     is uploaded as an artifact instead, so you can see exactly what each site
#     would have stored.
#
# Prerequisite: the new sites must already be present in config-de.json (ids
# 232–244). Commit the updated config-de.json together with this workflow, then
# run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      site_ids:
        description: "Comma-separated site ids to dry-run (default = the 13 new candidates)"
        type: string
        default: "232,233,234,235,236,237,238,239,240,241,242,243,244"

jobs:
  dry-run-new-de:
    name: dry-run new DE sites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `permissions: contents: write` on purpose — this job physically cannot
    # push. Checkout only needs read access, which is the default.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reuse the same Chromium cache key as the production workflow so a dry run
      # rides on the already-cached browser instead of re-downloading ~150MB.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      # monitor.py reads ANTHROPIC_API_KEY at import time, and the page-level
      # path can read the CV, so write it exactly as production does. Nothing is
      # actually sent to the model in a dry run.
      - name: Write CV file from secret
        env:
          CV_TEXT: ${{ secrets.CV_TEXT }}
        run: printenv CV_TEXT > cv.txt

      # THE dry-run gate. monitor.py reads DRY_RUN from this file == "true".
      - name: Enable dry-run
        run: echo "true" > dry_run.txt

      - name: Dry-run the new sites (DE config, targeted ids)
        env:
          CONFIG_FILE: config-de.json
          STATE_FILE: state-de-newsites-dryrun.json      # throwaway — not committed
          ISSUES_FILE: issues-de-newsites-dryrun.json     # throwaway — not committed
          SITE_DATA_DIR: dryrun-data                      # throwaway — dry run writes no report anyway
          FORCE_SITE_IDS: ${{ inputs.site_ids }}
          MONITOR_PW_WORKERS: "2"                         # aerzte + ci are the only two Playwright sites here
          ANTHROPIC_MAX_RPM: "5"
          RUN_LABEL: "🧪 DE new-sites dry-run"
          # Secrets mirror production so the transport ladder behaves identically
          # (incl. the Cloudflare-Worker fallback for any Azure-blocked site).
          # In a dry run none of these trigger a call or a notification.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # FEEDBACK_DRAIN intentionally unset: only the London lane may poll the
          # bot's getUpdates stream (and drain is skipped in dry runs regardless).
        run: python -u monitor.py

      - name: Upload seeded throwaway state (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-state
          path: |
            state-de-newsites-dryrun.json
            issues-de-newsites-dryrun.json
          if-no-files-found: ignore
