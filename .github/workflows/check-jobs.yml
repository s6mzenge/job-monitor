name: Job Monitor

on:
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Write config files from secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
        run: |
          printenv CONFIG_JSON > config.json
          printenv CV_TEXT > cv.txt

      - name: Run job monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: python monitor.py

      - name: Commit updated state and report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json site/data/
          git diff --staged --quiet || git commit -m "Update state"
          git push
