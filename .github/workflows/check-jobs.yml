name: Job Monitor

on:
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Write CV file from secret
        env:
          CV_TEXT: ${{ secrets.CV_TEXT }}
        run: |
          printenv CV_TEXT > cv.txt

      - name: Run job monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: python -u monitor.py

      - name: Commit updated state and report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json site/data/
          [ -f issues.json ] && git add issues.json || true
          git diff --staged --quiet || git commit -m "Update state"
          git push
