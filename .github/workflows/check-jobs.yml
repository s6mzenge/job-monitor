name: Job Monitor

on:
  workflow_dispatch:

# Two lanes run in parallel. Each lane serialises only against itself across
# triggers (so a slow DE run never blocks the next London run, and vice-versa).
jobs:
  check-jobs:
    name: check-jobs (${{ matrix.lane }})
    strategy:
      fail-fast: false          # one lane failing must not cancel the other
      matrix:
        include:
          - lane: de
            config: config-de.json
            state: state-de.json
            issues: issues-de.json
            data_dir: site/data            # keeps the existing dashboard working
            label: "🇩🇪 DE"
            max_rpm: "5"
            pw_workers: "1"          # DE has 1 Playwright site — a single browser is plenty
          - lane: london
            config: config-london.json
            state: state-london.json
            issues: issues-london.json
            data_dir: site/data-london
            label: "🇬🇧 London"
            max_rpm: "4"
            pw_workers: "2"          # London has ~12 Playwright sites — two browsers ≈ halves the render chain
            feedback_drain: "1"      # SOLE drain lane: one bot has one getUpdates stream, so exactly one lane may poll it
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: job-monitor-${{ matrix.lane }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The Chromium binary (~150MB download + extract) is the single biggest
      # per-run setup cost. Cache it keyed on requirements.txt (which pins the
      # playwright version), so it is fetched once per version bump, not every
      # 30-minute run. On a cache hit we still install the OS libraries (those
      # live system-wide and reset each run), which is much faster than the
      # browser download.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write CV file from secret
        env:
          CV_TEXT: ${{ secrets.CV_TEXT }}
        run: |
          printenv CV_TEXT > cv.txt

      - name: Run job monitor (${{ matrix.lane }})
        env:
          CONFIG_FILE: ${{ matrix.config }}
          STATE_FILE: ${{ matrix.state }}
          ISSUES_FILE: ${{ matrix.issues }}
          SITE_DATA_DIR: ${{ matrix.data_dir }}
          ANTHROPIC_MAX_RPM: ${{ matrix.max_rpm }}
          MONITOR_PW_WORKERS: ${{ matrix.pw_workers }}
          FEEDBACK_DRAIN: ${{ matrix.feedback_drain }}          # only london sets "1"; de has no such key → "" → drain off
          FEEDBACK_LOG_FILE: site/data-london/fb_log.json       # shared log: london (drain lane) WRITES it, BOTH lanes READ it so feedback calibrates de + london alike
          RUN_LABEL: ${{ matrix.label }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python -u monitor.py

      - name: Commit updated state and report (${{ matrix.lane }})
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${{ matrix.state }}" "${{ matrix.data_dir }}/"
          [ -f "${{ matrix.issues }}" ] && git add "${{ matrix.issues }}" || true
          git diff --staged --quiet || git commit -m "Update state (${{ matrix.lane }})"
          # Both lanes push to main in parallel. They only ever touch their own
          # files (state-<lane>.json / issues-<lane>.json / their data dir), so a
          # rebase can never content-conflict — the retries just absorb the
          # "remote moved between pull and push" timing when the other lane lands
          # first. Jittered backoff + 5 attempts keeps it reliable.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt rejected (remote moved) — rebasing and retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          [ "$pushed" = 1 ] || { echo "::error::could not push state after 5 attempts"; exit 1; }
